name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  # Orca commit whose validator checks this plugin. Bump it deliberately (it is the same recipe
  # stablyai/orca-plugins uses in .github/workflows/validate-catalog.yml).
  ORCA_REF: 554a16f32864f9e523520b927ac3b249767f3d0c

jobs:
  tests:
    name: Manifest pre-check and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:manifest
      # Drivers, SQL classification, gateway, launch hook, MCP server and worker wiring, no Orca needed.
      - run: npm run test:node
      # vendor/ must be what build/ produces from its lockfile.
      - name: Check vendor/ is up to date
        run: |
          npm run build:vendor
          git diff --exit-code -- vendor THIRD_PARTY_NOTICES.txt

  orca-validate:
    name: orca plugin validate (Orca's own validator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Check out Orca
        uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orca/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: orca/pnpm-lock.yaml

      # Why no install scripts: the validator needs only the JavaScript dependencies, not Electron.
      - name: Install Orca validator
        working-directory: orca
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages

      - name: Validate manifest, entries and print the release entry for HEAD
        working-directory: orca
        run: pnpm validate:plugin "$GITHUB_WORKSPACE/plugin"
